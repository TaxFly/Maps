<!DOCTYPE html>
<html lang="es">
<head>
<script>
(function() {
  var choice = 'auto';
  try { choice = localStorage.getItem('theme-choice') || 'auto'; } catch(e) {}
  if (choice === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else if (choice === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
})();
// Flag de debug: por defecto apagado en producción. Para activarlo, correr
// en la consola del navegador: localStorage.setItem('debug','1') y recargar.
try { window.DEBUG = localStorage.getItem('debug') === '1'; } catch(e) { window.DEBUG = false; }
function devError(...args) { if (window.DEBUG) console.error(...args); }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orlando Planning">
<title>Orlando Planning</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="js/firebase-sync.js"></script>
</head>
<body class="theme-outlets">

<header class="header">
  <div class="header-top">
    <div>
      <div class="header-title" id="main-title">Outlets <span class="ht-accent">Orlando</span></div>
      <div class="header-subtitle" id="main-subtitle">🛍️ Cronograma de compras · 25–27 enero</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="sync-dot" id="sync-dot" title="Estado de sincronización"></div>
      <button class="refresh-btn" id="refresh-btn" onclick="hardRefresh()" title="Actualizar app">↻</button>
      <div class="global-counter" id="global-counter">—</div>
    </div>
  </div>
</header>

<div class="nav-bar-wrap">
  <div class="nav-bar">
    <div class="tabs">
      <button class="tab active" id="nav-outlets" onclick="switchSection('outlets')"><span>🛍️</span><span class="nav-date">Outlets</span></button>
      <button class="tab" id="nav-comidas" onclick="switchSection('comidas')"><span>🍽️</span><span class="nav-date">Comidas</span></button>
      <button class="tab" id="nav-walmart" onclick="switchSection('walmart')"><span>🛒</span><span class="nav-date">Market</span></button>
      <button class="tab" id="nav-parques" onclick="switchSection('parques')"><span>🎢</span><span class="nav-date">Parks</span></button>
    </div>
    <button class="btn-nav-set" id="btnSettings" onclick="openSettingsDrawer()" title="Ajustes">⚙️</button>
  </div>
</div>

<div id="panel-outlets" class="panel active"></div>
<div id="panel-comidas" class="panel"></div>
<div id="panel-walmart" class="panel"></div>
<div id="panel-parques" class="panel"></div>

<div class="confetti-wrap" id="confetti-wrap"></div>

<div class="menu-overlay" id="settingsOverlay" onclick="closeSettingsDrawer()"></div>
<div class="settings-drawer" id="settingsDrawer">
  <div class="drawer-header">Ajustes</div>
  <div class="drawer-sub">Orlando Planning</div>
  <span class="drawer-section-label">Tema</span>
  <div class="theme-selector" id="themeSelector">
    <button class="theme-opt" data-theme-choice="light" onclick="setThemeChoice('light')">☀️ Claro</button>
    <button class="theme-opt" data-theme-choice="dark" onclick="setThemeChoice('dark')">🌙 Oscuro</button>
    <button class="theme-opt" data-theme-choice="auto" onclick="setThemeChoice('auto')">🌗 Auto</button>
  </div>
  <button class="drawer-close-btn" style="margin-top:20px" onclick="closeSettingsDrawer()">Cerrar</button>
</div>


<script src="js/theme.js"></script>

<script src="js/app.js"></script>


<button class="add-day-fab" id="addDayFab" onclick="openMealModal()">+ Agregar día</button>
<div class="modal-bg" id="mealModal">
  <div class="modal-box">
    <h2>Agregar día</h2>
    <div class="mform-group">
      <label>Fecha</label>
      <input type="text" id="mDate" placeholder="ej: 29 ene" oninput="this.classList.remove('error');document.getElementById('mDate-err').classList.remove('show')">
      <div class="field-error" id="mDate-err">Completá la fecha</div>
    </div>
    <div class="mform-group">
      <label>Título</label>
      <input type="text" id="mTitle" placeholder="ej: Disney extra" oninput="this.classList.remove('error');document.getElementById('mTitle-err').classList.remove('show')">
      <div class="field-error" id="mTitle-err">Completá el título del día</div>
    </div>
    <div class="mform-group"><label>Tipo</label>
      <select id="mType">
        <option value="disney">Disney 🏰</option>
        <option value="universal">Universal 🎢</option>
        <option value="free">Libre</option>
        <option value="arrival">Llegada</option>
        <option value="walmart">Walmart</option>
      </select>
    </div>
    <div class="mform-group"><label>Desayuno</label><input type="text" id="mBreakfast"></div>
    <div class="mform-group"><label>Almuerzo</label><input type="text" id="mLunch"></div>
    <div class="mform-group"><label>Cena</label><input type="text" id="mDinner"></div>
    <div class="modal-actions">
      <button class="mbtn-ghost" onclick="closeMealModal()">Cancelar</button>
      <button class="mbtn-primary" onclick="addMealDay()">Agregar</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="hotelEditModal">
  <div class="modal-box">
    <h2>✏️ Editar punto de partida</h2>
    <div class="mform-group">
      <label>Dirección</label>
      <input type="text" id="hotel-edit-addr" placeholder="ej: 324 Newcastle Dr, Kissimmee FL">
    </div>
    <div class="mform-group">
      <label>Link de Google Maps</label>
      <input type="text" id="hotel-edit-url" placeholder="https://maps.google.com/...">
    </div>
    <div class="modal-actions">
      <button class="mbtn-ghost" onclick="closeHotelEdit()">Cancelar</button>
      <button class="mbtn-primary" onclick="saveHotelEdit()">Guardar</button>
    </div>
  </div>
</div>
<div class="mtoast" id="mtoast"></div>

<!-- Custom confirm/alert modal -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitle"></div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-actions">
      <button class="confirm-btn-cancel" id="confirmCancel">Cancelar</button>
      <button class="confirm-btn-ok" id="confirmOk">Confirmar</button>
    </div>
  </div>
</div>
<!-- Custom alert modal -->
<div class="confirm-overlay" id="alertOverlay">
  <div class="confirm-box">
    <div class="confirm-title" id="alertTitle">Atención</div>
    <div class="confirm-msg" id="alertMsg"></div>
    <div class="confirm-actions" style="justify-content:center">
      <button class="confirm-btn-ok safe" id="alertOk" style="flex:unset;min-width:120px" onclick="closeAlert()">Entendido</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="wmAddModal">
  <div class="modal-box">
    <h2>Agregar producto</h2>
    <div class="mform-group">
      <label>Nombre</label>
      <input type="text" id="wm-add-name" placeholder="ej: Mantequilla de maní" oninput="this.classList.remove('error');document.getElementById('wm-add-name-err').classList.remove('show')">
      <div class="field-error" id="wm-add-name-err">Escribí el nombre del producto</div>
    </div>
    <div class="mform-group">
      <label>Categoría</label>
      <select id="wm-add-cat">
        <option value="pan">🥖 Panadería y Snacks</option>
        <option value="lacteos">🥚 Lácteos y Huevos</option>
        <option value="carnes">🥩 Carnes y Fiambres</option>
        <option value="secos">🍝 Secos y Enlatados</option>
        <option value="congelados">🧊 Congelados</option>
        <option value="desayuno">☕ Desayuno y Bebidas</option>
        <option value="extras">🎒 Extras</option>
      </select>
    </div>
    <div class="mform-group">
      <label>Cantidad</label>
      <input type="number" id="wm-add-qty" placeholder="1" min="0.1" step="0.1" value="1">
    </div>
    <div class="mform-group">
      <label>Unidad de medida</label>
      <input type="text" id="wm-add-unit" placeholder="ej: bolsa 16oz, caja, lb…">
    </div>
    <div class="mform-group">
      <label>Precio unitario (USD)</label>
      <input type="number" id="wm-add-price" placeholder="0.00" min="0" step="0.01">
    </div>
    <div class="modal-actions">
      <button class="mbtn-ghost" onclick="wmCloseAddModal()">Cancelar</button>
      <button class="mbtn-primary" onclick="wmAddItem()">Agregar</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="shopAddModal">
  <div class="modal-box">
    <h2>Agregar prenda / accesorio</h2>
    <div class="mform-group">
      <label>¿Qué querés comprar?</label>
      <input type="text" id="shop-add-name" placeholder="ej: Zapatillas Nike Air Max" oninput="this.classList.remove('error');document.getElementById('shop-add-name-err').classList.remove('show')">
      <div class="field-error" id="shop-add-name-err">Escribí qué querés comprar</div>
    </div>
    <div class="mform-group">
      <label>Categoría</label>
      <select id="shop-add-cat">
        <option value="remeras">👕 Remeras / T-Shirts</option>
        <option value="pantalones">👖 Pantalones / Jeans</option>
        <option value="ropa-deportiva">🏃 Ropa Deportiva</option>
        <option value="calzado">👟 Calzado / Zapatillas</option>
        <option value="accesorios">🎒 Accesorios / Bolsos</option>
        <option value="varios">🛍️ Varios</option>
      </select>
    </div>
    <div class="mform-group">
      <label>Talle</label>
      <input type="text" id="shop-add-size" placeholder="ej: M, 42, 32x30, único…">
    </div>
    <div class="mform-group">
      <label>Tienda sugerida</label>
      <input type="text" id="shop-add-store" placeholder="ej: Nike Clearance, Ross, Vineland…">
    </div>
    <div class="mform-group">
      <label>Prioridad</label>
      <select id="shop-add-prio">
        <option value="alta">🔴 Alta</option>
        <option value="media" selected>🟡 Media</option>
        <option value="baja">🟢 Baja</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="mbtn-ghost" onclick="shopCloseAddModal()">Cancelar</button>
      <button class="mbtn-primary" onclick="shopAddItem()">Agregar</button>
    </div>
  </div>
</div>
</body>
</html>
